databases:
  - name: mindflow-db
    plan: free
    databaseName: mindflow
    user: mindflow

services:
  - type: static
    name: Mini_ChatBot-1
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mindflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindflow-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: GOOGLE_API_KEY
        sync: false          # Render 대시보드에서 직접 입력
      - key: JWT_SECRET_KEY
        sync: false          # Render 대시보드에서 직접 입력 (고정 강력 비밀키)
      - key: ALLOWED_ORIGINS
        sync: false          # 프론트엔드 URL (예: https://mindflow.onrender.com)
      - key: REDIS_URL
        sync: false          # Render Redis 서비스 URL (선택)
      - key: FRONTEND_URL
        sync: false          # 비밀번호 재설정 링크용 프론트엔드 URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
